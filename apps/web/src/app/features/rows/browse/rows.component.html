<div class="space-y-6 px-6 py-8 sm:px-8">
  <div
    class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-700 dark:bg-slate-900">
    <h2 class="text-2xl font-bold text-slate-900 dark:text-white">Data</h2>
    <p class="mt-2 text-slate-600 dark:text-slate-300">
      Stored records and imported JSON-backed data for your vault.
    </p>
  </div>

  <section
    *ngIf="successMessage"
    class="rounded-2xl border border-emerald-200 bg-emerald-50 p-4 text-sm text-emerald-700 dark:border-emerald-900 dark:bg-emerald-950/40 dark:text-emerald-200">
    {{ successMessage }}
  </section>

  <section
    *ngIf="errorMessage"
    class="rounded-2xl border border-rose-200 bg-rose-50 p-4 text-sm text-rose-700 dark:border-rose-900 dark:bg-rose-950/40 dark:text-rose-200">
    {{ errorMessage }}
  </section>

  <section class="grid gap-6 xl:grid-cols-[1.6fr_0.9fr]">
    <div
      class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-700 dark:bg-slate-900">
      <div class="mb-4 flex items-end gap-3">
        <div class="w-full max-w-xs">
          <label
            for="rowCategoryFilter"
            class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-200">
            Filter by category
          </label>
          <select
            id="rowCategoryFilter"
            [value]="selectedRowCategoryId"
            (change)="applyCategoryFilter($any($event.target).value)"
            [disabled]="isLoading"
            class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-slate-900 focus:border-slate-500 focus:outline-none focus:ring-2 focus:ring-slate-200 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100 dark:focus:border-slate-400 dark:focus:ring-slate-700">
            <option value="all">All categories</option>
            <option *ngFor="let category of rowCategoryOptions" [value]="category.id">
              {{ category.name }}
            </option>
          </select>
        </div>
      </div>

      <div
        *ngIf="!isLoading; else loadingState"
        class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm dark:border-slate-700 dark:bg-slate-900">
        <table
          class="min-w-full divide-y divide-slate-200 text-left text-sm dark:divide-slate-700">
          <thead class="bg-slate-50 text-slate-600 dark:bg-slate-800 dark:text-slate-300">
            <tr>
              <th class="px-4 py-3 font-medium"></th>
              <th class="px-4 py-3 font-medium">Title</th>
              <!-- <th class="px-4 py-3 font-medium">Username</th> -->
              <th class="px-4 py-3 font-medium">Category</th>
              <!-- <th class="px-4 py-3 font-medium">Status</th> -->
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-200 dark:divide-slate-700">
            <tr *ngFor="let item of records">
              <td class="px-4 py-3 font-medium text-slate-900 dark:text-white">
                <span class="cursor-pointer" (click)="getSelected(item.RecordID)"
                  >...</span
                >
              </td>
              <td class="px-4 py-3 font-medium text-slate-900 dark:text-white">
                {{ item.Title }}
              </td>
              <!-- <td class="px-4 py-3 font-medium text-slate-900 dark:text-white">
            {{ item.CategoryID }}
          </td> -->
              <td class="px-4 py-3 font-medium text-slate-900 dark:text-white">
                <span
                  class="rounded-full px-2 py-1 text-xs font-semibold bg-amber-100 text-amber-700"
                  >{{ item.Category.Name }}</span
                >
              </td>

              <!--<td class="px-4 py-3 text-slate-600 dark:text-slate-300">
            {{ item.username }}
          </td>
          <td class="px-4 py-3 text-slate-600 dark:text-slate-300">
            {{ item.category }}
          </td>
          <td class="px-4 py-3">
            <span
              class="inline-flex rounded-full bg-emerald-100 px-2.5 py-1 text-xs font-semibold text-emerald-700"
              >{{ item.status }}</span
            >
          </td> -->
            </tr>
          </tbody>
        </table>
      </div>

      <ng-template #loadingState>
        <section
          class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-700 dark:bg-slate-900">
          <p class="text-slate-600 dark:text-slate-300">Loading rows...</p>
        </section>
      </ng-template>
    </div>
  </section>
</div>
