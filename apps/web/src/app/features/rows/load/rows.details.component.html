<div class="space-y-6 px-6 py-8 sm:px-8">
  <div
    class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-700 dark:bg-slate-900">
    <h2 class="text-2xl font-bold text-slate-900 dark:text-white">Data Details</h2>
    <p class="mt-2 text-slate-600 dark:text-slate-300">
      Stored records and imported JSON-backed data for your vault.
    </p>
  </div>

  <section
    *ngIf="record as selectedRecord; else loadingState"
    class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-700 dark:bg-slate-900">
    <form class="grid gap-5 md:grid-cols-2" autocomplete="off">
      <div class="space-y-2">
        <label
          for="recordId"
          class="block text-sm font-medium text-slate-700 dark:text-slate-200">
          Record ID
        </label>
        <input
          id="recordId"
          type="number"
          [value]="selectedRecord.RecordID"
          readonly
          class="w-full rounded-xl border border-slate-300 bg-slate-100 px-3 py-2 text-slate-900 focus:outline-none dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100" />
      </div>

      <div class="space-y-2">
        <label
          for="title"
          class="block text-sm font-medium text-slate-700 dark:text-slate-200">
          Title
        </label>
        <input
          id="title"
          type="text"
          [value]="selectedRecord.Title"
          class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-slate-900 focus:border-slate-500 focus:outline-none focus:ring-2 focus:ring-slate-200 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100 dark:focus:border-slate-400 dark:focus:ring-slate-700" />
      </div>

      <div class="space-y-2">
        <label
          for="username"
          class="block text-sm font-medium text-slate-700 dark:text-slate-200">
          Username
        </label>
        <input
          id="username"
          type="text"
          [value]="selectedRecord.Username"
          class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-slate-900 focus:border-slate-500 focus:outline-none focus:ring-2 focus:ring-slate-200 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100 dark:focus:border-slate-400 dark:focus:ring-slate-700" />
      </div>

      <div class="space-y-2">
        <label
          for="password"
          class="block text-sm font-medium text-slate-700 dark:text-slate-200">
          Password
        </label>
        <input
          id="password"
          type="text"
          [value]="selectedRecord.Password"
          class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-slate-900 focus:border-slate-500 focus:outline-none focus:ring-2 focus:ring-slate-200 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100 dark:focus:border-slate-400 dark:focus:ring-slate-700" />
      </div>

      <div class="space-y-2 md:col-span-2">
        <label
          for="url"
          class="block text-sm font-medium text-slate-700 dark:text-slate-200">
          URL
        </label>
        <input
          id="url"
          type="text"
          [value]="selectedRecord.URL"
          class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-slate-900 focus:border-slate-500 focus:outline-none focus:ring-2 focus:ring-slate-200 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100 dark:focus:border-slate-400 dark:focus:ring-slate-700" />
      </div>

      <div class="space-y-2 md:col-span-2">
        <label
          for="notes"
          class="block text-sm font-medium text-slate-700 dark:text-slate-200">
          Notes
        </label>
        <textarea
          id="notes"
          rows="4"
          class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-slate-900 focus:border-slate-500 focus:outline-none focus:ring-2 focus:ring-slate-200 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100 dark:focus:border-slate-400 dark:focus:ring-slate-700"
          >{{ selectedRecord.Notes }}</textarea
        >
      </div>

      <div class="space-y-2">
        <label
          for="categoryId"
          class="block text-sm font-medium text-slate-700 dark:text-slate-200">
          Category ID
        </label>
        <input
          id="categoryId"
          type="number"
          [value]="selectedRecord.CategoryID"
          class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-slate-900 focus:border-slate-500 focus:outline-none focus:ring-2 focus:ring-slate-200 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100 dark:focus:border-slate-400 dark:focus:ring-slate-700" />
      </div>

      <div class="space-y-2">
        <label
          for="categoryName"
          class="block text-sm font-medium text-slate-700 dark:text-slate-200">
          Category Name
        </label>
        <input
          id="categoryName"
          type="text"
          [value]="selectedRecord.Category.Name"
          readonly
          class="w-full rounded-xl border border-slate-300 bg-slate-100 px-3 py-2 text-slate-900 focus:outline-none dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100" />
      </div>
    </form>
  </section>

  <ng-template #loadingState>
    <section
      class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-700 dark:bg-slate-900">
      <p class="text-slate-600 dark:text-slate-300">Loading data details...</p>
    </section>
  </ng-template>
</div>
