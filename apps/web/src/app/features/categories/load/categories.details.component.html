<div class="space-y-6 px-6 py-8 sm:px-8">
  <div
    class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-700 dark:bg-slate-900">
    <h2 class="text-2xl font-bold text-slate-900 dark:text-white">Category Details</h2>
    <p class="mt-2 text-slate-600 dark:text-slate-300">
      Modify records by type and keep your vault structured.
    </p>
  </div>

  <section
    *ngIf="category as selectedCategory; else loadingState"
    class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-700 dark:bg-slate-900">
    <form class="grid gap-5 md:grid-cols-2" autocomplete="off">
      <div class="space-y-2">
        <label
          for="categoryId"
          class="block text-sm font-medium text-slate-700 dark:text-slate-200">
          Category ID
        </label>
        <input
          id="categoryId"
          type="number"
          [value]="selectedCategory.CategoryID"
          readonly
          disabled
          class="dark:disabled:bg-slate-700 w-full rounded-xl border border-slate-300 bg-slate-100 px-3 py-2 text-slate-900 focus:outline-none dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100" />
      </div>

      <div class="space-y-2">
        <label
          for="name"
          class="block text-sm font-medium text-slate-700 dark:text-slate-200">
          Name
        </label>
        <input
          id="name"
          type="text"
          [value]="selectedCategory.Name"
          class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-slate-900 focus:border-slate-500 focus:outline-none focus:ring-2 focus:ring-slate-200 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100 dark:focus:border-slate-400 dark:focus:ring-slate-700" />
      </div>

      <div class="space-y-2 md:col-span-2">
        <label
          for="description"
          class="block text-sm font-medium text-slate-700 dark:text-slate-200">
          Description
        </label>
        <textarea
          id="description"
          rows="4"
          class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-slate-900 focus:border-slate-500 focus:outline-none focus:ring-2 focus:ring-slate-200 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100 dark:focus:border-slate-400 dark:focus:ring-slate-700"
          >{{ selectedCategory.Description }}</textarea
        >
      </div>

      <div class="space-y-2 md:col-span-2">
        <label
          for="nameWithBadge"
          class="block text-sm font-medium text-slate-700 dark:text-slate-200">
          Name With Badge
        </label>
        <input
          id="nameWithBadge"
          type="text"
          [value]="selectedCategory.NameWithBadge"
          class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-slate-900 focus:border-slate-500 focus:outline-none focus:ring-2 focus:ring-slate-200 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100 dark:focus:border-slate-400 dark:focus:ring-slate-700" />
      </div>
    </form>
  </section>

  <ng-template #loadingState>
    <section
      class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-700 dark:bg-slate-900">
      <p class="text-slate-600 dark:text-slate-300">Loading category details...</p>
    </section>
  </ng-template>
</div>
