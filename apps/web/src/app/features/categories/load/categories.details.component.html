<app-base-load
  [service]="categoriesService"
  [baseForm]="categoriesForm"
  [title]="'Categories'"
  [description]="'Modify records by type and keep your vault structured.'">
  <form
    [formGroup]="categoriesForm"
    (ngSubmit)="onSubmit()"
    class="grid gap-5 md:grid-cols-2"
    autocomplete="off">
    <!-- Form fields go here -->
    <div class="space-y-2">
      <label
        for="categoryID"
        class="block text-sm font-medium text-slate-700 dark:text-slate-200">
        Category ID
      </label>
      <input
        id="categoryID"
        type="text"
        formControlName="CategoryID"
        readonly
        class="dark:disabled:bg-slate-700 w-full rounded-xl border border-slate-300 bg-slate-100 px-3 py-2 text-slate-900 focus:outline-none dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100" />
    </div>
    <div class="space-y-2">
      <label
        for="name"
        class="block text-sm font-medium text-slate-700 dark:text-slate-200">
        Name*
      </label>
      <input
        id="name"
        type="text"
        formControlName="Name"
        (input)="onUpdateBadgeName(categoriesForm)"
        class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-slate-900 focus:border-slate-500 focus:outline-none focus:ring-2 focus:ring-slate-200 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100 dark:focus:border-slate-400 dark:focus:ring-slate-700" />

      <p
        *ngIf="
          categoriesForm.controls['Name'].invalid &&
          categoriesForm.controls['Name'].touched
        "
        class="text-sm text-rose-600 dark:text-rose-300">
        Name is required and must be between 2 and 60 characters.
      </p>
    </div>

    <div class="space-y-2 md:col-span-2">
      <label
        for="description"
        class="block text-sm font-medium text-slate-700 dark:text-slate-200">
        Description
      </label>
      <textarea
        id="description"
        formControlName="Description"
        rows="4"
        class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-slate-900 focus:border-slate-500 focus:outline-none focus:ring-2 focus:ring-slate-200 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100 dark:focus:border-slate-400 dark:focus:ring-slate-700"></textarea>

      <p
        *ngIf="
          categoriesForm.controls['Description'].invalid &&
          categoriesForm.controls['Description'].touched
        "
        class="text-sm text-rose-600 dark:text-rose-300">
        Description cannot exceed 250 characters.
      </p>
    </div>

    <div class="space-y-2 md:col-span-2">
      <label
        for="nameWithBadge"
        class="block text-sm font-medium text-slate-700 dark:text-slate-200">
        Name With Badge
      </label>
      <input
        id="nameWithBadge"
        type="text"
        formControlName="NameWithBadge"
        class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-slate-900 focus:border-slate-500 focus:outline-none focus:ring-2 focus:ring-slate-200 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100 dark:focus:border-slate-400 dark:focus:ring-slate-700" />

      <p
        *ngIf="
          categoriesForm.controls['NameWithBadge'].invalid &&
          categoriesForm.controls['NameWithBadge'].touched
        "
        class="text-sm text-rose-600 dark:text-rose-300">
        Name with badge is required and cannot exceed 80 characters.
      </p>
    </div>
    <div class="md:col-span-2 flex justify-end gap-3 mt-5">
      <button
        type="button"
        (click)="onDelete()"
        [disabled]="
          categoriesService.loading() || categoriesForm.controls['CategoryID'].value == 0
        "
        class="inline-flex items-center rounded-xl border border-rose-300 bg-white px-4 py-2 text-sm font-semibold text-rose-700 transition hover:bg-rose-50 disabled:cursor-not-allowed disabled:opacity-60 dark:border-rose-700 dark:bg-transparent dark:text-rose-300 dark:hover:bg-rose-950/30">
        Delete
      </button>

      <button
        type="submit"
        [disabled]="categoriesService.loading() || categoriesForm.invalid"
        class="inline-flex items-center rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white transition hover:bg-slate-800 disabled:cursor-not-allowed disabled:opacity-60 dark:bg-slate-100 dark:text-slate-900 dark:hover:bg-slate-200">
        Save
      </button>
    </div>
  </form>
</app-base-load>
