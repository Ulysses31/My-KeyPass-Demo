<div class="space-y-6 px-6 py-8 sm:px-8">
  <div
    class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-700 dark:bg-slate-900"
  >
    <h2 class="text-2xl font-bold text-slate-900 dark:text-white">
      Categories
    </h2>
    <p class="mt-2 text-slate-600 dark:text-slate-300">
      Organize records by type and keep your vault structured.
    </p>
  </div>

  <div class="grid gap-4 md:grid-cols-2 xl:grid-cols-4">
    <article
      *ngFor="let category of categories"
      class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-700 dark:bg-slate-900"
    >
      <div class="flex items-center justify-between">
        <span
          class="rounded-full px-2.5 py-1 text-xs font-semibold"
          [ngClass]="category.color"
          >{{ category.count }}</span
        >
        <span class="text-xs uppercase tracking-[0.2em] text-slate-400"
          >items</span
        >
      </div>
      <h3 class="mt-4 text-lg font-semibold text-slate-900 dark:text-white">
        {{ category.name }}
      </h3>
      <p class="mt-2 text-sm text-slate-600 dark:text-slate-300">
        {{ category.description }}
      </p>
    </article>
  </div>
</div>
