<div
  *ngIf="isOpen"
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 p-4">
  <div
    class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-6 shadow-2xl dark:border-slate-700 dark:bg-slate-900">
    <h3 *ngIf="title" class="text-lg font-semibold text-slate-900 dark:text-white">
      {{ title }}
    </h3>

    <p
      *ngIf="description"
      class="mt-2 text-sm text-slate-600 dark:text-slate-300">
      {{ description }}
    </p>

    <div class="mt-6 flex justify-end gap-3">
      <button
        type="button"
        [disabled]="isBusy"
        (click)="onNo()"
        class="inline-flex items-center rounded-xl border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-60 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700">
        {{ noLabel }}
      </button>
      <button
        type="button"
        [disabled]="isBusy"
        (click)="onYes()"
        class="inline-flex items-center rounded-xl bg-rose-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-rose-500 disabled:cursor-not-allowed disabled:opacity-60">
        {{ yesLabel }}
      </button>
    </div>
  </div>
</div>
