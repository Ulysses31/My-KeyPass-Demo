<main class="min-h-screen bg-slate-100 px-6 py-10 text-slate-900">
  <section
    class="mx-auto max-w-3xl rounded-2xl border border-slate-200 bg-white p-8 shadow-xl shadow-slate-200/70 sm:p-12"
  >
    <p
      class="mb-4 text-xs font-bold uppercase tracking-[0.2em] text-indigo-600"
    >
      Angular SPA
    </p>
    <h1
      class="mb-4 text-4xl font-bold tracking-tight text-slate-900 sm:text-5xl"
    >
      {{ title }}
    </h1>
    <p class="text-lg text-slate-600">
      Web app ready for the desktop shell, API, and JSON-serving backend.
    </p>

    <div class="mt-8 flex flex-wrap gap-3">
      <span
        class="rounded-full bg-indigo-100 px-3 py-1 text-sm font-medium text-indigo-700"
        >Tailwind CSS</span
      >
      <span
        class="rounded-full bg-emerald-100 px-3 py-1 text-sm font-medium text-emerald-700"
        >Angular 18</span
      >
      <span
        class="rounded-full bg-amber-100 px-3 py-1 text-sm font-medium text-amber-700"
        >Ready to build</span
      >
    </div>
  </section>
</main>
