<div
  class="min-h-screen bg-slate-100 text-slate-900 transition-colors duration-200 dark:bg-slate-950 dark:text-slate-100"
  [class.dark]="isDarkMode"
>
  <div class="flex min-h-screen">
    <aside
      class="hidden w-72 flex-col border-r border-slate-200 bg-white text-slate-800 lg:flex dark:border-slate-800 dark:bg-slate-900 dark:text-slate-100"
    >
      <div
        class="flex items-center gap-3 border-b border-slate-200 px-6 py-5 dark:border-slate-700"
      >
        <div
          class="flex h-10 w-10 items-center justify-center rounded-xl bg-indigo-500/20 text-indigo-300"
        >
          <app-hero-icon name="lock-closed" sizeClass="h-6 w-6"></app-hero-icon>
        </div>
        <div>
          <p
            class="text-xs uppercase tracking-[0.22em] text-slate-500 dark:text-slate-400"
          >
            Secure
          </p>
          <h2 class="text-lg font-semibold">KeyPass</h2>
        </div>
      </div>

      <nav class="flex-1 space-y-2 px-4 py-6">
        <a
          routerLink="/overview"
          routerLinkActive="bg-slate-100 text-slate-900 dark:bg-slate-800 dark:text-white"
          [routerLinkActiveOptions]="{ exact: true }"
          class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-slate-600 transition hover:bg-slate-100 hover:text-slate-900 dark:text-slate-300 dark:hover:bg-slate-800/70 dark:hover:text-white"
        >
          <app-hero-icon name="home"></app-hero-icon>
          Overview
        </a>
        <a
          routerLink="/categories"
          routerLinkActive="bg-slate-100 text-slate-900 dark:bg-slate-800 dark:text-white"
          class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-slate-600 transition hover:bg-slate-100 hover:text-slate-900 dark:text-slate-300 dark:hover:bg-slate-800/70 dark:hover:text-white"
        >
          <app-hero-icon name="bars-3"></app-hero-icon>
          Categories
        </a>
        <a
          routerLink="/rows"
          routerLinkActive="bg-slate-100 text-slate-900 dark:bg-slate-800 dark:text-white"
          class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-slate-600 transition hover:bg-slate-100 hover:text-slate-900 dark:text-slate-300 dark:hover:bg-slate-800/70 dark:hover:text-white"
        >
          <app-hero-icon name="table-cells"></app-hero-icon>
          Data
        </a>
      </nav>

      <div class="border-t border-slate-200 p-4 dark:border-slate-700">
        <div class="rounded-xl bg-slate-100 p-3 dark:bg-slate-800">
          <p
            class="text-xs uppercase tracking-[0.2em] text-slate-500 dark:text-slate-400"
          >
            Team
          </p>
          <p
            class="mt-2 text-sm font-medium text-slate-800 dark:text-slate-100"
          >
            Personal vault
          </p>
        </div>
      </div>
    </aside>

    <main class="flex-1">
      <header
        class="border-b border-slate-200 bg-white/80 backdrop-blur-sm dark:border-slate-800 dark:bg-slate-900/80"
      >
        <div class="flex items-center justify-between px-6 py-4 sm:px-8">
          <div>
            <p
              class="text-xs font-semibold uppercase tracking-[0.2em] text-slate-500 dark:text-slate-400"
            >
              Dashboard
            </p>
            <h1 class="mt-1 text-2xl font-bold text-slate-900 dark:text-white">
              {{ title }}
            </h1>
          </div>

          <div class="flex items-center gap-3">
            <div
              class="inline-flex rounded-xl border border-slate-200 bg-slate-100 p-1 dark:border-slate-700 dark:bg-slate-800"
            >
              <button
                type="button"
                aria-label="Switch to light theme"
                class="flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-sm font-medium transition"
                [ngClass]="{
                  'bg-white text-slate-900 shadow-sm dark:bg-slate-700 dark:text-white':
                    !isDarkMode,
                  'text-slate-500 dark:text-slate-300': isDarkMode,
                }"
                (click)="theme = 'light'; applyTheme()"
              >
                <app-hero-icon name="sun"></app-hero-icon>
              </button>
              <button
                type="button"
                aria-label="Switch to dark theme"
                class="flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-sm font-medium transition"
                [ngClass]="{
                  'bg-white text-slate-900 shadow-sm dark:bg-slate-700 dark:text-white':
                    isDarkMode,
                  'text-slate-500 dark:text-slate-300': !isDarkMode,
                }"
                (click)="theme = 'dark'; applyTheme()"
              >
                <app-hero-icon name="moon"></app-hero-icon>
              </button>
            </div>

            <button
              class="inline-flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-medium text-slate-700 shadow-sm hover:bg-slate-50 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700"
            >
              <app-hero-icon name="arrow-down-tray"></app-hero-icon>
              Export
            </button>
            <button
              class="inline-flex items-center gap-2 rounded-xl bg-indigo-600 px-4 py-2 text-sm font-semibold text-white shadow-lg shadow-indigo-600/20 hover:bg-indigo-500"
            >
              <app-hero-icon name="plus"></app-hero-icon>
              New entry
            </button>
          </div>
        </div>
      </header>

      <router-outlet></router-outlet>
    </main>
  </div>
</div>
