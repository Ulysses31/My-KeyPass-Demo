<div
  class="min-h-screen bg-slate-100 text-slate-900 transition-colors duration-200 dark:bg-slate-950 dark:text-slate-100"
  [class.dark]="isDarkMode"
>
  <div class="flex min-h-screen">
    <aside
      class="hidden w-72 flex-col border-r border-slate-200 bg-slate-950 text-slate-100 lg:flex dark:border-slate-800 dark:bg-slate-900"
    >
      <div
        class="flex items-center gap-3 border-b border-slate-800 px-6 py-5 dark:border-slate-700"
      >
        <div
          class="flex h-10 w-10 items-center justify-center rounded-xl bg-indigo-500/20 text-lg font-bold text-indigo-300"
        >
          K
        </div>
        <div>
          <p class="text-xs uppercase tracking-[0.22em] text-slate-400">
            Secure
          </p>
          <h2 class="text-lg font-semibold">KeyPass</h2>
        </div>
      </div>

      <nav class="flex-1 space-y-2 px-4 py-6">
        <a
          routerLink="/overview"
          routerLinkActive="bg-slate-800 text-white"
          [routerLinkActiveOptions]="{ exact: true }"
          class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-slate-300 transition hover:bg-slate-800/70 hover:text-white"
        >
          <span class="h-2.5 w-2.5 rounded-full bg-indigo-400"></span>
          Overview
        </a>
        <a
          routerLink="/categories"
          routerLinkActive="bg-slate-800 text-white"
          class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-slate-300 transition hover:bg-slate-800/70 hover:text-white"
        >
          <span class="h-2.5 w-2.5 rounded-full bg-slate-500"></span>
          Categories
        </a>
        <a
          routerLink="/data"
          routerLinkActive="bg-slate-800 text-white"
          class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-slate-300 transition hover:bg-slate-800/70 hover:text-white"
        >
          <span class="h-2.5 w-2.5 rounded-full bg-slate-500"></span>
          Data
        </a>
      </nav>

      <div class="border-t border-slate-800 p-4 dark:border-slate-700">
        <div class="rounded-xl bg-slate-900 p-3 dark:bg-slate-800">
          <p class="text-xs uppercase tracking-[0.2em] text-slate-400">Team</p>
          <p class="mt-2 text-sm font-medium text-slate-100">Personal vault</p>
        </div>
      </div>
    </aside>

    <main class="flex-1">
      <header
        class="border-b border-slate-200 bg-white/80 backdrop-blur-sm dark:border-slate-800 dark:bg-slate-900/80"
      >
        <div class="flex items-center justify-between px-6 py-4 sm:px-8">
          <div>
            <p
              class="text-xs font-semibold uppercase tracking-[0.2em] text-slate-500 dark:text-slate-400"
            >
              Dashboard
            </p>
            <h1 class="mt-1 text-2xl font-bold text-slate-900 dark:text-white">
              {{ title }}
            </h1>
          </div>

          <div class="flex items-center gap-3">
            <div
              class="inline-flex rounded-xl border border-slate-200 bg-slate-100 p-1 dark:border-slate-700 dark:bg-slate-800"
            >
              <button
                type="button"
                aria-label="Switch to light theme"
                class="flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-sm font-medium transition"
                [ngClass]="{
                  'bg-white text-slate-900 shadow-sm dark:bg-slate-700 dark:text-white':
                    !isDarkMode,
                  'text-slate-500 dark:text-slate-300': isDarkMode,
                }"
                (click)="theme = 'light'; applyTheme()"
              >
                <svg
                  viewBox="0 0 24 24"
                  class="h-4 w-4 fill-current"
                  aria-hidden="true"
                >
                  <path
                    d="M12 2.75a.75.75 0 0 1 .75.75V4.5a.75.75 0 0 1-1.5 0v-1a.75.75 0 0 1 .75-.75Zm0 15.5a.75.75 0 0 1 .75.75v1a.75.75 0 0 1-1.5 0v-1a.75.75 0 0 1 .75-.75ZM4.93 4.93a.75.75 0 0 1 1.06 0l.7.7a.75.75 0 1 1-1.06 1.06l-.7-.7a.75.75 0 0 1 0-1.06Zm12.34 12.34a.75.75 0 0 1 1.06 0l.7.7a.75.75 0 0 1-1.06 1.06l-.7-.7a.75.75 0 0 1 0-1.06ZM2.75 12a.75.75 0 0 1 .75-.75h1a.75.75 0 0 1 0 1.5h-1A.75.75 0 0 1 2.75 12Zm15.5 0a.75.75 0 0 1 .75-.75h1a.75.75 0 0 1 0 1.5h-1a.75.75 0 0 1-.75-.75ZM5.99 17.01a.75.75 0 0 1 1.06 0l.7.7a.75.75 0 1 1-1.06 1.06l-.7-.7a.75.75 0 0 1 0-1.06Zm12.02-12.02a.75.75 0 0 1 1.06 0l.7.7a.75.75 0 0 1-1.06 1.06l-.7-.7a.75.75 0 0 1 0-1.06ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Z"
                  />
                </svg>
              </button>
              <button
                type="button"
                aria-label="Switch to dark theme"
                class="flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-sm font-medium transition"
                [ngClass]="{
                  'bg-white text-slate-900 shadow-sm dark:bg-slate-700 dark:text-white':
                    isDarkMode,
                  'text-slate-500 dark:text-slate-300': !isDarkMode,
                }"
                (click)="theme = 'dark'; applyTheme()"
              >
                <svg
                  viewBox="0 0 24 24"
                  class="h-4 w-4 fill-current"
                  aria-hidden="true"
                >
                  <path
                    d="M20.5 14.5A7.5 7.5 0 0 1 9.5 3.5a.75.75 0 0 0-.96-.96A9.5 9.5 0 1 0 21.46 15.46a.75.75 0 0 0-.96-.96Z"
                  />
                </svg>
              </button>
            </div>

            <button
              class="rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-medium text-slate-700 shadow-sm hover:bg-slate-50 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700"
            >
              Export
            </button>
            <button
              class="rounded-xl bg-indigo-600 px-4 py-2 text-sm font-semibold text-white shadow-lg shadow-indigo-600/20 hover:bg-indigo-500"
            >
              New entry
            </button>
          </div>
        </div>
      </header>

      <router-outlet></router-outlet>
    </main>
  </div>
</div>
